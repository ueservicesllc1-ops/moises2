<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Geist:wght@600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-card-highlight {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow-blue {
            box-shadow: 0 0 15px rgba(173, 199, 255, 0.3);
        }
        .mixer-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            border: 2px solid #adc7ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(173, 199, 255, 0.5);
        }
        body {
            background-color: #050505;
            color: #e5e2e1;
            overflow-x: hidden;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#ebb2ff",
                        "surface-tint": "#adc7ff",
                        "tertiary-container": "#1da800",
                        "on-background": "#e5e2e1",
                        "secondary": "#ebb2ff",
                        "primary-fixed-dim": "#adc7ff",
                        "on-tertiary": "#053900",
                        "on-primary-container": "#00285b",
                        "on-primary-fixed": "#001a41",
                        "on-secondary": "#520072",
                        "on-primary": "#002e68",
                        "surface-variant": "#353534",
                        "on-tertiary-fixed": "#022100",
                        "on-error": "#690005",
                        "tertiary-fixed-dim": "#2ae500",
                        "error-container": "#93000a",
                        "surface-container": "#201f1f",
                        "surface-container-low": "#1c1b1b",
                        "surface-container-lowest": "#0e0e0e",
                        "tertiary-fixed": "#79ff5b",
                        "on-secondary-container": "#fff6fc",
                        "on-secondary-fixed": "#320047",
                        "primary-fixed": "#d8e2ff",
                        "inverse-surface": "#e5e2e1",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#74009f",
                        "surface-container-high": "#2a2a2a",
                        "primary-container": "#4a8eff",
                        "on-primary-fixed-variant": "#004493",
                        "outline-variant": "#414754",
                        "on-surface": "#e5e2e1",
                        "inverse-on-surface": "#313030",
                        "tertiary": "#2ae500",
                        "secondary-fixed": "#f8d8ff",
                        "on-tertiary-fixed-variant": "#095300",
                        "background": "#131313",
                        "error": "#ffb4ab",
                        "surface": "#131313",
                        "surface-dim": "#131313",
                        "surface-container-highest": "#353534",
                        "primary": "#adc7ff",
                        "secondary-container": "#b600f8",
                        "surface-bright": "#3a3939",
                        "on-surface-variant": "#c1c6d7",
                        "on-tertiary-container": "#043200",
                        "inverse-primary": "#005bc0",
                        "outline": "#8b90a0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "md": "16px",
                        "base": "4px",
                        "sm": "8px",
                        "xs": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-caps": ["Geist"],
                        "title-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/30 backdrop-blur-xl border-b border-white/10 flex justify-between items-center px-margin-mobile h-16">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tighter">SonicSplit AI</h1>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden bg-primary-container flex items-center justify-center">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional close-up profile avatar of a music producer in a dimly lit studio environment with neon blue and purple ambient lighting. The style is cinematic and high-tech, matching the futuristic AI audio theme." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCvw1VCBnpo8bPPhU0W_XQhPRHQe-ge3RFrA0SO7AcnDxptZFRXFeGFjb5qZR9PxuD98R2Rj7mMwh_IbOTUE3_yW1F5a0DiLzspIqJhVz2KIFA-bwRIVfLzkR9TRKwj4IyWxeMBxgJ9mtwypnS1kELRKKnIgVMugeJm8Piv_ZapdFZoAnzLFAAhMCHxYfV627KEeb_de5U6XBeDqRhdQNPcwEvIqLY_MM0dnWl1P7f0XqdJHm03Wd5KcMhjvf3rHaq1GnUHAV1j"/>
</div>
</header>
<main class="pt-24 pb-32 px-margin-mobile max-w-xl mx-auto space-y-lg">
<!-- Upload Section -->
<section class="glass-card glass-card-highlight rounded-xl p-xl flex flex-col items-center justify-center border-dashed border-2 border-primary/20 transition-all hover:border-primary/50 group cursor-pointer h-64" id="upload-zone">
<div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center mb-md group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="cloud_upload">cloud_upload</span>
</div>
<h2 class="font-title-md text-title-md text-primary mb-xs">Upload File</h2>
<p class="font-body-sm text-on-surface-variant text-center opacity-70">Drag and drop audio files or click to browse (MP3, WAV, FLAC)</p>
<input class="hidden" id="audio-input" type="file"/>
</section>
<!-- Configuration Section -->
<div class="space-y-lg">
<div class="space-y-sm">
<h3 class="font-label-caps text-label-caps text-on-surface-variant opacity-80 uppercase">Separation Mode</h3>
<div class="grid grid-cols-1 gap-md">
<!-- Option 1 -->
<label class="relative flex items-center p-md glass-card rounded-xl cursor-pointer border border-transparent hover:border-primary/30 transition-all group">
<input checked="" class="hidden peer" name="mode" type="radio" value="2stem"/>
<div class="flex-1">
<p class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">Vocal vs. Instrumental</p>
<p class="font-body-sm text-on-surface-variant">Simple 2-stem extraction</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary-container flex items-center justify-center transition-all">
<div class="w-2.5 h-2.5 rounded-full bg-on-primary-container opacity-0 peer-checked:opacity-100"></div>
</div>
</label>
<!-- Option 2 -->
<label class="relative flex items-center p-md glass-card rounded-xl cursor-pointer border border-transparent hover:border-primary/30 transition-all group">
<input class="hidden peer" name="mode" type="radio" value="multitrack"/>
<div class="flex-1">
<p class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">Full Multitrack</p>
<p class="font-body-sm text-on-surface-variant">Vocal, Piano, Drums, Bass, Guitar, Others</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary-container flex items-center justify-center transition-all">
<div class="w-2.5 h-2.5 rounded-full bg-on-primary-container opacity-0 peer-checked:opacity-100"></div>
</div>
</label>
</div>
</div>
<!-- Quality Toggles -->
<div class="glass-card rounded-xl p-md flex items-center justify-between">
<div>
<h3 class="font-title-md text-title-md">Processing Quality</h3>
<p class="font-body-sm text-on-surface-variant">High-fidelity neural network engine</p>
</div>
<div class="flex items-center bg-surface-container-highest p-1 rounded-lg">
<button class="px-4 py-1.5 rounded-md font-label-caps text-label-caps transition-all text-on-surface-variant" id="btn-normal">Normal</button>
<button class="px-4 py-1.5 rounded-md font-label-caps text-label-caps bg-primary-container text-on-primary-container shadow-lg" id="btn-hifi">HiFi</button>
</div>
</div>
<!-- AI Action Button -->
<button class="w-full h-16 rounded-xl bg-gradient-to-r from-primary to-primary-container text-on-primary-container font-headline-lg-mobile text-headline-lg-mobile shadow-[0_0_20px_rgba(173,199,255,0.4)] active:scale-[0.98] transition-all flex items-center justify-center gap-sm" id="start-btn">
<span class="material-symbols-outlined" data-icon="bolt" data-weight="fill">bolt</span>
                Start AI Separation
            </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface/10 backdrop-blur-2xl border-t border-white/5 flex justify-around items-center h-20 px-4 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.5)]">
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:text-primary transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="library_music">library_music</span>
<span class="font-label-caps text-label-caps">Library</span>
</div>
<div class="flex flex-col items-center justify-center text-primary bg-primary-container/20 rounded-xl px-4 py-1 shadow-[0_0_15px_rgba(173,199,255,0.3)] active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="cloud_upload">cloud_upload</span>
<span class="font-label-caps text-label-caps">Upload</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:text-primary transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-caps text-label-caps">Settings</span>
</div>
</nav>
<script>
        // Simple interactions for demo
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('audio-input');
        const startBtn = document.getElementById('start-btn');
        const hifiBtn = document.getElementById('btn-hifi');
        const normalBtn = document.getElementById('btn-normal');

        uploadZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const fileName = e.target.files[0].name;
                uploadZone.querySelector('p').innerText = `Selected: ${fileName}`;
                uploadZone.classList.add('border-primary');
            }
        });

        startBtn.addEventListener('click', () => {
            startBtn.innerHTML = `
                <svg class="animate-spin h-6 w-6 text-on-primary-container" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Processing...
            `;
            setTimeout(() => {
                startBtn.innerHTML = `<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Success!`;
                startBtn.classList.replace('from-primary', 'from-tertiary-container');
            }, 2000);
        });

        const toggleQuality = (isHifi) => {
            if (isHifi) {
                hifiBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-lg');
                hifiBtn.classList.remove('text-on-surface-variant');
                normalBtn.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-lg');
                normalBtn.classList.add('text-on-surface-variant');
            } else {
                normalBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-lg');
                normalBtn.classList.remove('text-on-surface-variant');
                hifiBtn.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-lg');
                hifiBtn.classList.add('text-on-surface-variant');
            }
        };

        hifiBtn.addEventListener('click', () => toggleQuality(true));
        normalBtn.addEventListener('click', () => toggleQuality(false));

        // Atmospheric background pulse logic
        let opac = 0.03;
        let direction = 1;
        setInterval(() => {
            opac += 0.001 * direction;
            if (opac > 0.06 || opac < 0.02) direction *= -1;
            document.querySelectorAll('.glass-card').forEach(card => {
                card.style.backgroundColor = `rgba(255, 255, 255, ${opac})`;
            });
        }, 50);
    </script>
</body></html>
